name: Handbook

"on":
  pull_request:
    paths:
      - docs/**
      - CHANGELOG.md
      - .github/workflows/handbook.yml
      - tests/handbook*
  push:
    branches:
      - main
    paths:
      - docs/**
      - CHANGELOG.md
      - .github/workflows/handbook.yml
      - tests/handbook*
  workflow_dispatch:

permissions: {}

concurrency:
  group: handbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check handbook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs/handbook

      - name: Check workflow contract
        run: ruby tests/handbook-workflow.rb

      - name: Build production handbook
        run: bundle exec jekyll build
        working-directory: docs/handbook

      - name: Check public output
        run: bash tests/handbook.sh

      - name: Upload checked Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/handbook/_site

  deploy:
    name: Publish handbook
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
