name: Handbook

"on":
  pull_request:
  push:
    branches:
      - main
    paths:
      - docs/**
      - CHANGELOG.md
      - .github/workflows/handbook.yml
      - tests/handbook*
  workflow_dispatch:

permissions: {}

concurrency:
  group: handbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect handbook changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      handbook: ${{ steps.paths.outputs.handbook }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check workflow contract
        run: ruby tests/handbook-workflow.rb

      - name: Detect handbook paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "handbook=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
              docs CHANGELOG.md .github/workflows/handbook.yml ':(glob)tests/handbook*'; then
            echo "handbook=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 1 ]]; then
              echo "Failed to compare handbook paths (git exit $status)" >&2
              exit "$status"
            fi
            echo "handbook=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and check handbook
    needs: changes
    if: needs.changes.outputs.handbook == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs/handbook

      - name: Build production handbook
        run: bundle exec jekyll build
        working-directory: docs/handbook

      - name: Check public output
        run: bash tests/handbook.sh

      - name: Upload checked Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/handbook/_site

  handbook:
    name: Handbook
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HANDBOOK_CHANGED: ${{ needs.changes.outputs.handbook }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" == success ]] && {
            [[ "$HANDBOOK_CHANGED" == true && "$BUILD_RESULT" == success ]] ||
            [[ "$HANDBOOK_CHANGED" == false && "$BUILD_RESULT" == skipped ]]
          }; then
            echo "Handbook validation passed."
          else
            echo "Handbook validation failed: changes=$CHANGES_RESULT handbook=$HANDBOOK_CHANGED build=$BUILD_RESULT" >&2
            exit 1
          fi

  deploy:
    name: Publish handbook
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
