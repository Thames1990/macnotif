name: Validate

on:
  pull_request:
    paths: &app_paths
      - Sources/**
      - Resources/**
      - Package.swift
      - Package.resolved
      - scripts/**
      - templates/**
      - tests/release-*
      - tests/formula-template.sh
      - .github/workflows/validate.yml
  push:
    branches:
      - "**"
    paths: *app_paths

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.architecture }} macOS
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build native executable
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: bash scripts/build-release.sh "$ARCHITECTURE" build/macnotif

      - name: Test executable behavior
        run: bash tests/release-smoke.sh build/macnotif

      - name: Test formula rendering
        run: bash tests/formula-template.sh

      - name: Test release preparation and controlled publication
        run: bash tests/release-preparation.sh
