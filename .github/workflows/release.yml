name: Release Homebrew formula

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment from the latest published release"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: homebrew-tap-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Finalize changelog and tag release source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - name: Check out dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/release.py prepare \
            --event "$EVENT_NAME" --ref "$SELECTED_REF" --bump "$BUMP" \
            --source "$SOURCE_COMMIT" --run-id "$RUN_ID" --repository "$GH_REPO" \
            --output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate prepared source and notes
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/release.py notes --tag "$TAG_NAME" --source "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Build native executable
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: bash scripts/build-release.sh "$ARCHITECTURE" build/macnotif

      - name: Verify executable behavior
        run: bash tests/release-smoke.sh build/macnotif

      - name: Package release archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          mkdir -p dist
          archive_directory="$(mktemp -d)"
          trap 'rm -rf "$archive_directory"' EXIT
          cp build/macnotif "$archive_directory/macnotif"
          tar -czf "dist/macnotif-${version}-${ARCHITECTURE}.tar.gz" \
            -C "$archive_directory" macnotif

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.architecture }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release and formula
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download architecture builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate release metadata and downloaded builds
        id: release
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: $TAG_NAME" >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          arm64_archive="dist/macnotif-${version}-arm64.tar.gz"
          x86_64_archive="dist/macnotif-${version}-x86_64.tar.gz"
          test -f "$arm64_archive"
          test -f "$x86_64_archive"
          {
            echo "tag_name=$TAG_NAME"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Require tap publishing token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "Configure HOMEBREW_TAP_TOKEN with contents access to Thames1990/homebrew-tap." >&2
            exit 1
          fi

      - name: Publish or verify public release artifacts
        id: published
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          python3 scripts/release.py publish --tag "$TAG_NAME" --source "$SOURCE_COMMIT" \
            --dist dist --output "$GITHUB_OUTPUT"

      - name: Render formula from published checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARM64_SHA256: ${{ steps.published.outputs.arm64_sha256 }}
          X86_64_SHA256: ${{ steps.published.outputs.x86_64_sha256 }}
        run: |
          bash scripts/render-formula.sh "$VERSION" "$ARM64_SHA256" "$X86_64_SHA256" \
            generated/Formula/macnotif.rb

      - name: Check out public tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thames1990/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Publish formula in the tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd tap
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/generated/Formula/macnotif.rb" Formula/macnotif.rb
          git rm --ignore-unmatch Formula/dinky-notify.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/macnotif.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update macnotif to $VERSION"
            git push origin HEAD:main
          fi

  verify-install:
    name: Verify Homebrew install on ${{ matrix.architecture }}
    needs: [prepare, publish]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - name: Install from public tap and verify behavior
        run: |
          manual_bin="$HOME/.local/bin/macnotif"
          if [[ -e "$manual_bin" || -L "$manual_bin" ]]; then
            echo "The runner already has a macnotif manual install; refusing to overwrite it." >&2
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          manual_target="$RUNNER_TEMP/manual-macnotif"
          printf '#!/bin/sh\nexit 0\n' > "$manual_target"
          chmod +x "$manual_target"
          ln -s "$manual_target" "$manual_bin"

          profile_state() {
            for profile in "$HOME/.zprofile" "$HOME/.zshrc" "$HOME/.bash_profile"; do
              if [[ -f "$profile" ]]; then
                shasum -a 256 "$profile"
              else
                printf 'missing %s\n' "$profile"
              fi
            done
          }
          before_path="$PATH"
          before_profiles="$(profile_state)"
          brew install Thames1990/tap/macnotif
          brew test Thames1990/tap/macnotif
          executable="$(brew --prefix macnotif)/bin/macnotif"
          test -x "$executable"
          bash tests/release-smoke.sh "$executable"

          if [[ "$PATH" != "$before_path" ]]; then
            echo "Homebrew installation changed PATH." >&2
            exit 1
          fi
          if [[ "$(profile_state)" != "$before_profiles" ]]; then
            echo "Homebrew installation changed a shell profile." >&2
            exit 1
          fi
          if [[ ! -L "$manual_bin" || "$(readlink "$manual_bin")" != "$manual_target" ]]; then
            echo "Homebrew installation changed the existing manual symlink." >&2
            exit 1
          fi
