name: Release Homebrew formula

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: homebrew-tap-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: $TAG_NAME" >&2
            exit 1
          fi

      - name: Build native executable
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: bash scripts/build-release.sh "$ARCHITECTURE" build/macnotif

      - name: Verify executable behavior
        run: bash tests/release-smoke.sh build/macnotif

      - name: Package release archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          mkdir -p dist
          archive_directory="$(mktemp -d)"
          trap 'rm -rf "$archive_directory"' EXIT
          cp build/macnotif "$archive_directory/macnotif"
          tar -czf "dist/macnotif-${version}-${ARCHITECTURE}.tar.gz" \
            -C "$archive_directory" macnotif

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.architecture }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release and formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download architecture builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate release metadata and downloaded builds
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: $TAG_NAME" >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          arm64_archive="dist/macnotif-${version}-arm64.tar.gz"
          x86_64_archive="dist/macnotif-${version}-x86_64.tar.gz"
          test -f "$arm64_archive"
          test -f "$x86_64_archive"
          {
            echo "tag_name=$TAG_NAME"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Require tap publishing token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "Configure HOMEBREW_TAP_TOKEN with contents access to Thames1990/homebrew-tap." >&2
            exit 1
          fi

      - name: Publish or verify public release artifacts
        id: published
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure HOMEBREW_TAP_TOKEN with contents access to Thames1990/homebrew-tap." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source commit SHA is invalid." >&2
            exit 1
          fi

          arm64_name="macnotif-${VERSION}-arm64.tar.gz"
          x86_64_name="macnotif-${VERSION}-x86_64.tar.gz"
          if gh release view "$TAG_NAME" --repo Thames1990/homebrew-tap >/dev/null 2>&1; then
            existing_release="$(mktemp -d)"
            trap 'rm -rf "$existing_release"' EXIT
            gh release download "$TAG_NAME" --repo Thames1990/homebrew-tap \
              --pattern "$arm64_name" \
              --pattern "$x86_64_name" \
              --pattern SHA256SUMS \
              --pattern SOURCE_COMMIT \
              --dir "$existing_release"

            if [[ "$(cat "$existing_release/SOURCE_COMMIT")" != "$SOURCE_COMMIT" ]]; then
              echo "Release $TAG_NAME belongs to a different source commit; refusing to replace it." >&2
              exit 1
            fi
            if [[ "$(wc -l < "$existing_release/SHA256SUMS" | tr -d ' ')" != "2" ]]; then
              echo "Release $TAG_NAME has an invalid checksum manifest." >&2
              exit 1
            fi
            (
              cd "$existing_release"
              sha256sum --check SHA256SUMS
            )
            arm64_sha256="$(awk -v name="$arm64_name" '$2 == name {print $1}' "$existing_release/SHA256SUMS")"
            x86_64_sha256="$(awk -v name="$x86_64_name" '$2 == name {print $1}' "$existing_release/SHA256SUMS")"
            if [[ ! "$arm64_sha256" =~ ^[0-9a-f]{64}$ || ! "$x86_64_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Release $TAG_NAME is missing architecture checksums." >&2
              exit 1
            fi
            cp "$existing_release/$arm64_name" "dist/$arm64_name"
            cp "$existing_release/$x86_64_name" "dist/$x86_64_name"
            cp "$existing_release/SHA256SUMS" dist/SHA256SUMS
            echo "Verified the existing release for source commit $SOURCE_COMMIT."
          else
            (
              cd dist
              sha256sum "$arm64_name" "$x86_64_name" > SHA256SUMS
            )
            printf '%s\n' "$SOURCE_COMMIT" > dist/SOURCE_COMMIT
            gh release create "$TAG_NAME" dist/*.tar.gz dist/SHA256SUMS dist/SOURCE_COMMIT \
              --repo Thames1990/homebrew-tap \
              --title "MacNotif $VERSION" \
              --notes "Unsigned native macOS executables for Apple Silicon and Intel. SHA-256 checksums are provided in SHA256SUMS and verified by the formula."
          fi

          arm64_sha256="$(awk -v name="$arm64_name" '$2 == name {print $1}' dist/SHA256SUMS)"
          x86_64_sha256="$(awk -v name="$x86_64_name" '$2 == name {print $1}' dist/SHA256SUMS)"
          {
            echo "arm64_sha256=$arm64_sha256"
            echo "x86_64_sha256=$x86_64_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Render formula from published checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARM64_SHA256: ${{ steps.published.outputs.arm64_sha256 }}
          X86_64_SHA256: ${{ steps.published.outputs.x86_64_sha256 }}
        run: |
          bash scripts/render-formula.sh "$VERSION" "$ARM64_SHA256" "$X86_64_SHA256" \
            generated/Formula/macnotif.rb

      - name: Check out public tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thames1990/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Publish formula in the tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd tap
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/generated/Formula/macnotif.rb" Formula/macnotif.rb
          git rm --ignore-unmatch Formula/dinky-notify.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/macnotif.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update macnotif to $VERSION"
            git push origin HEAD:main
          fi

  verify-install:
    name: Verify Homebrew install on ${{ matrix.architecture }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install from public tap and verify behavior
        run: |
          manual_bin="$HOME/.local/bin/macnotif"
          if [[ -e "$manual_bin" || -L "$manual_bin" ]]; then
            echo "The runner already has a macnotif manual install; refusing to overwrite it." >&2
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          manual_target="$RUNNER_TEMP/manual-macnotif"
          printf '#!/bin/sh\nexit 0\n' > "$manual_target"
          chmod +x "$manual_target"
          ln -s "$manual_target" "$manual_bin"

          profile_state() {
            for profile in "$HOME/.zprofile" "$HOME/.zshrc" "$HOME/.bash_profile"; do
              if [[ -f "$profile" ]]; then
                shasum -a 256 "$profile"
              else
                printf 'missing %s\n' "$profile"
              fi
            done
          }
          before_path="$PATH"
          before_profiles="$(profile_state)"
          brew install Thames1990/tap/macnotif
          brew test Thames1990/tap/macnotif
          executable="$(brew --prefix macnotif)/bin/macnotif"
          test -x "$executable"
          bash tests/release-smoke.sh "$executable"

          if [[ "$PATH" != "$before_path" ]]; then
            echo "Homebrew installation changed PATH." >&2
            exit 1
          fi
          if [[ "$(profile_state)" != "$before_profiles" ]]; then
            echo "Homebrew installation changed a shell profile." >&2
            exit 1
          fi
          if [[ ! -L "$manual_bin" || "$(readlink "$manual_bin")" != "$manual_target" ]]; then
            echo "Homebrew installation changed the existing manual symlink." >&2
            exit 1
          fi
