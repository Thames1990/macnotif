title: MacNotif
source: handbook
description: A quick-start handbook for MacNotif's macOS notice HUD.
url: https://macnotif.mohrworks.com
baseurl: ""
theme: just-the-docs
lang: en

search_enabled: true
search:
  heading_level: 2
  previews: 3
  focus_shortcut_key: k

color_scheme: light
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top
gh_edit_link: false

# Only handbook/ is a site source. Maintainer instructions stay outside it.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.sh"
  - "*.py"

defaults:
  - scope:
      path: ""
    values:
      layout: default
